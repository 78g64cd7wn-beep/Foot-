name: Vérification actu foot

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Vérifier l'actu et générer un post si besoin
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate_post.py

      - name: Commit et push si un nouveau post a été généré
        run: |
          git config user.name "agent-foot-bot"
          git config user.email "bot@users.noreply.github.com"
          git add posts_log.md posted_topics.json
          git commit -m "Post foot $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "Rien à committer"
          git push


